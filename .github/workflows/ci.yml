name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        working-directory: backend
        run: |
          go vet ./...
          go test -v -count=1 ./...

  build-frontend:
    name: Frontend Static Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build Next.js Static Export
        working-directory: frontend
        run: bun run build

      - name: Upload frontend static artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/out/
          retention-days: 1

  cross-compile-check:
    name: Cross-Compilation Verification
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: 7
          - target: linux-arm64
            goos: linux
            goarch: arm64
            goarm: ""
          - target: linux-amd64
            goos: linux
            goarch: amd64
            goarm: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend static export
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/cmd/qmanager/dist

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Compile QManager binary (${{ matrix.target }})
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          go build -ldflags="-s -w" -o qmanager-${{ matrix.target }} ./cmd/qmanager
          ls -lh qmanager-${{ matrix.target }}
